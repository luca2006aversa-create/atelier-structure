<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier structure</title>
<link rel="stylesheet" href="vendor/charte/charte.css">
<link rel="stylesheet" href="atelier.css">
</head>
<body class="a-page atelier">

<header class="tete">
  <div class="marque"><span data-p="treillis"></span><strong>Structure</strong></div>
  <select class="a-champ projet" id="projet" title="Projet ouvert" aria-label="Projet" hidden></select>
  <nav class="a-onglets feuilles" id="feuilles" aria-label="Feuilles"></nav>
  <button class="btn-ico" id="b-feuille" title="Nouvelle feuille : coupe ou plan" aria-haspopup="true" aria-expanded="false"><i class="a-icone" data-i="ajouter"></i></button>
  <div class="versions" id="versions" aria-label="Versions de la feuille"></div>
  <div class="actions">
    <button class="btn-ico" id="b-annuler" title="Annuler (Ctrl+Z)"><span data-p="annuler"></span></button>
    <button class="btn-ico" id="b-retablir" title="Rétablir (Ctrl+Y)"><span data-p="retablir"></span></button>
    <button class="a-bouton" id="b-3d" title="Voir la structure en 3D"><span data-p="cube"></span>3D</button>
    <button class="a-bouton" id="b-schema" title="Schéma structurel : appuis, charges, efforts, déformée"><span data-p="schema"></span>Schéma</button>
    <button class="a-bouton" id="b-calcul" title="Note de calcul : descente de charges, efforts, flèches"><i class="a-icone" data-i="pilotage"></i>Calcul</button>
    <button class="a-bouton fantome" id="b-dossier" title="Ouvrir le dossier des dessins"><span data-p="dossier"></span>Dossier</button>
    <span class="etat" id="etat" title="Sauvegarde automatique"><i class="a-icone" data-i="horloge"></i><span>Chargement</span></span>
  </div>
</header>

<div class="menu-feuille menu-export" id="menu-export" role="menu" hidden>
  <button type="button" role="menuitem" data-format="ifc"><span data-p="volume"></span><span><strong>IFC</strong><small>ArchiCAD, Revit · vrais poteaux, poutres, murs</small></span></button>
  <button type="button" role="menuitem" data-format="dxf3d"><span data-p="volume"></span><span><strong>DXF 3D</strong><small>AutoCAD, Rhino · volumes</small></span></button>
  <button type="button" role="menuitem" data-format="obj"><span data-p="volume"></span><span><strong>OBJ</strong><small>Rhino, ArchiCAD, Revit · maillage léger</small></span></button>
  <button type="button" role="menuitem" data-format="dxf2d"><span data-p="exporter"></span><span><strong>DXF 2D</strong><small>AutoCAD et tous · le dessin de la feuille</small></span></button>
  <button type="button" role="menuitem" data-format="rhino"><span data-p="exporter"></span><span><strong>Grasshopper</strong><small>Rhino · axes et sections pilotables (.json)</small></span></button>
</div>
<div class="menu-feuille" id="menu-feuille" role="menu" hidden>
  <button type="button" role="menuitem" data-type="coupe"><span data-p="f-coupe"></span><span><strong>Coupe</strong><small>Portique, vu de face</small></span></button>
  <button type="button" role="menuitem" data-type="plan"><span data-p="f-plan"></span><span><strong>Plan</strong><small>Murs, portes, vu de dessus</small></span></button>
</div>

<aside class="outils" id="outils" aria-label="Outils"></aside>

<main class="scene" id="scene">
  <svg id="dessin" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="consigne" id="consigne"></div>

  <div class="pied">
    <span class="info chiffre" id="coords">x 0 · y 0</span>
    <span class="info" id="accroche">Grille</span>
    <label class="info" title="Pas de la grille">
      <span data-p="grille"></span>
      <select id="pas">
        <option value="0.05">5 cm</option>
        <option value="0.1">10 cm</option>
        <option value="0.25" selected>25 cm</option>
        <option value="0.5">50 cm</option>
        <option value="1">1 m</option>
      </select>
    </label>
    <label class="info" title="Aimant : accroche aux nœuds, aux barres et à la grille">
      <span data-p="aimant"></span>
      <input type="checkbox" class="a-interrupteur" id="aimant" checked>
    </label>
    <span class="zoom">
      <button class="btn-ico" id="b-zoom-moins" title="Dézoomer"><span data-p="zoom-moins"></span></button>
      <span class="info chiffre" id="zoom">1 m</span>
      <button class="btn-ico" id="b-zoom-plus" title="Zoomer"><span data-p="zoom-plus"></span></button>
      <button class="btn-ico" id="b-cadrer" title="Tout voir (touche F)"><span data-p="cadrer"></span></button>
    </span>
  </div>

  <div class="carte3d" id="carte3d" hidden>
    <div class="carte3d-tete">
      <label>Entraxe <input class="a-champ petit" id="entraxe" type="number" step="0.5" min="0.5"> m</label>
      <label>Nombre <input class="a-champ petit" id="nombre" type="number" step="1" min="1" max="40"></label>
      <span class="a-discret" id="hauteur3d" hidden></span>
      <span class="espace"></span>
      <button class="btn-ico on" id="b-3d-volumes" title="Volumes / traits"><span data-p="volume"></span></button>
      <button class="btn-ico" id="b-3d-png" title="Enregistrer l'image (.png)"><span data-p="image"></span></button>
      <button class="btn-ico" id="b-3d-export" title="Exporter : ArchiCAD, Revit, Rhino, AutoCAD" aria-haspopup="true" aria-expanded="false"><span data-p="exporter"></span></button>
      <button class="btn-ico" id="b-3d-grand" title="Agrandir"><span data-p="cadrer"></span></button>
      <button class="btn-ico" id="b-3d-fermer" title="Fermer"><i class="a-icone" data-i="fermer"></i></button>
    </div>
    <canvas id="canvas3d"></canvas>
    <div class="carte3d-pied a-discret">Glisser = tourner · molette = zoom · double-clic = recentrer</div>
  </div>

  <div class="carte3d carte-schema" id="carte-schema" hidden>
    <div class="carte3d-tete">
      <div class="sch-modes" id="sch-modes" role="tablist" aria-label="Lecture du schéma"></div>
      <span class="espace"></span>
      <button class="btn-ico" id="b-sch-grand" title="Agrandir"><span data-p="cadrer"></span></button>
      <button class="btn-ico" id="b-sch-svg" title="Enregistrer le schéma en SVG"><span data-p="exporter"></span></button>
      <button class="btn-ico" id="b-sch-fermer" title="Fermer"><i class="a-icone" data-i="fermer"></i></button>
    </div>
    <div class="sch-vue" id="sch-vue"></div>
    <div class="carte3d-pied a-discret" id="sch-pied"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <button class="a-bouton principal terminer" id="terminer" hidden><i class="a-icone" data-i="ok"></i>Terminer</button>
  <input type="file" accept="image/*" id="fichier-image" hidden>
</main>

<aside class="panneau" id="panneau" aria-label="Réglages"></aside>

<section class="calcul" id="calcul" aria-label="Note de calcul" hidden></section>
<button class="a-bouton fantome c-fermer" id="b-calcul-fermer" hidden><i class="a-icone" data-i="fermer"></i>Fermer</button>

<script src="vendor/charte/icones.js"></script>
<script type="module" src="app.js"></script>
<dialog class="d-code" id="d-code">
  <form id="f-code">
    <h2>Travailler à plusieurs</h2>
    <p class="a-discret">Entre le code d’équipe pour dessiner. Sans code, tu vois le travail des autres en direct, sans pouvoir le changer.</p>
    <label class="ligne-code"><span>Code</span><input class="a-champ" id="code-equipe" autocomplete="off" spellcheck="false" placeholder="ex. TOIT-1234"></label>
    <label class="ligne-code"><span>Prénom</span><input class="a-champ" id="code-pseudo" autocomplete="given-name" maxlength="40"></label>
    <p class="code-erreur" id="code-erreur"></p>
    <div class="rangee">
      <button type="button" class="a-bouton fantome" id="code-annuler">Juste regarder</button>
      <button type="submit" class="a-bouton principal">Entrer</button>
    </div>
  </form>
</dialog>
</body>
</html>
